<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIRCADIA - Contrôle de lumière intelligente</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-custom {
            animation: pulse 2.5s infinite;
        }
    </style>
</head>
<body class="bg-[#0f0c09]">
    <div id="root"></div>

    <script>
        // SVG Icons
        const icons = {
            sun: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>',
            moon: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
            clock: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>',
            power: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>',
            settings: '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m2.98 2.98l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m2.98-2.98l4.24-4.24M19.78 19.78l-4.24-4.24m-2.98-2.98l-4.24-4.24"></path></svg>',
        };

        function CircadiaApp() {
            const [activeTab, setActiveTab] = React.useState("lumiere");
            const [isOn, setIsOn] = React.useState(true);
            const [brightness, setBrightness] = React.useState(72);
            const [temperature, setTemperature] = React.useState(4200);
            const [wakeTime, setWakeTime] = React.useState("07:30");
            const [sunriseDuration, setSunriseDuration] = React.useState(30);
            const [sleepTime, setSleepTime] = React.useState("22:45");
            const [ambientMode, setAmbientMode] = React.useState("Réveil naturel");

            const tabs = [
                { id: "lumiere", label: "Lumière", icon: "sun" },
                { id: "heure", label: "Heure", icon: "clock" },
                { id: "ambiances", label: "Ambiances", icon: "sparkles" },
                { id: "routine", label: "Routine", icon: "activity" },
                { id: "maison", label: "Maison", icon: "home" },
                { id: "parametres", label: "Réglages", icon: "settings" },
            ];

            const temperatureLabel = React.useMemo(() => {
                if (temperature < 3000) return "Chaud et apaisant";
                if (temperature < 5000) return "Naturel et équilibré";
                return "Clair et énergisant";
            }, [temperature]);

            const intensityText = isOn ? `${brightness}%` : "Éteinte";

            const renderContent = () => {
                switch (activeTab) {
                    case "lumiere":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Réglage de la lumière</h2>
                                <p className="mt-1 text-sm text-white/50">Adaptez CIRCADIA à votre réveil, votre humeur et votre pièce.</p>
                                <div className="mt-5 space-y-4">
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="h-10 w-10 rounded-2xl bg-amber-400/15 text-amber-300 flex items-center justify-center">🎚️</div>
                                                <p className="font-medium text-white">Luminosité</p>
                                            </div>
                                            <p className="text-amber-300 font-semibold">{brightness}%</p>
                                        </div>
                                        <input type="range" min="1" max="100" value={brightness} onChange={(e) => setBrightness(Number(e.target.value))} className="mt-5 w-full" />
                                    </div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="h-10 w-10 rounded-2xl bg-amber-400/15 text-amber-300 flex items-center justify-center">☀️</div>
                                                <p className="font-medium text-white">Température</p>
                                            </div>
                                            <p className="text-amber-300 font-semibold">{temperature}K</p>
                                        </div>
                                        <input type="range" min="1800" max="6500" value={temperature} onChange={(e) => setTemperature(Number(e.target.value))} className="mt-5 w-full" />
                                    </div>
                                    <div className="rounded-3xl border border-amber-300/20 bg-amber-300/10 p-5 text-white">
                                        <p className="text-amber-200 font-semibold">{temperatureLabel}</p>
                                        <p className="mt-2 text-sm text-white/60">Une lumière plus chaude favorise la détente. Une lumière plus claire aide à se sentir plus éveillé.</p>
                                    </div>
                                </div>
                            </div>
                        );
                    case "heure":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Heure et réveil</h2>
                                <p className="mt-1 text-sm text-white/50">Programmez un lever de soleil progressif, sans réveil brutal.</p>
                                <div className="mt-5 space-y-4 text-white">
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5 flex items-center justify-between">
                                        <p>Heure de réveil</p>
                                        <input type="time" value={wakeTime} onChange={(e) => setWakeTime(e.target.value)} className="bg-black/30 border border-white/10 rounded-xl px-3 py-2 text-white" />
                                    </div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">
                                        <div className="flex items-center justify-between">
                                            <p>Durée d'aube: {sunriseDuration} min</p>
                                        </div>
                                        <input type="range" min="10" max="60" value={sunriseDuration} onChange={(e) => setSunriseDuration(Number(e.target.value))} className="mt-5 w-full" />
                                    </div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5 flex items-center justify-between">
                                        <p>Extinction progressive</p>
                                        <input type="time" value={sleepTime} onChange={(e) => setSleepTime(e.target.value)} className="bg-black/30 border border-white/10 rounded-xl px-3 py-2 text-white" />
                                    </div>
                                </div>
                            </div>
                        );
                    case "ambiances":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Ambiances</h2>
                                <p className="mt-1 text-sm text-white/50">Choisissez un mode adapté à chaque moment.</p>
                                <div className="mt-5 grid grid-cols-2 gap-3">
                                    {["Réveil naturel", "Relaxation", "Lecture", "Énergie"].map(mode => (
                                        <button key={mode} onClick={() => setAmbientMode(mode)} className={`text-left rounded-3xl p-4 border transition text-white ${ambientMode === mode ? "bg-amber-400 text-black border-amber-300" : "bg-white/6 border-white/10"}`}>
                                            <p className="font-semibold">{mode}</p>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        );
                    case "routine":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Routine bien-être</h2>
                                <p className="mt-1 text-sm text-white/50">Créez une journée plus régulière.</p>
                                <div className="mt-5 space-y-3 text-white">
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Rappel coucher - Notification 30 min avant l'extinction.</div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Suivi du rythme - Conseils selon vos horaires.</div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Mode nuit - Lumière très douce après 22h.</div>
                                </div>
                            </div>
                        );
                    case "maison":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Maison connectée</h2>
                                <p className="mt-1 text-sm text-white/50">Connectez CIRCADIA à vos assistants.</p>
                                <div className="mt-5 space-y-3 text-white">
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Wi-Fi - Réseau Maison_5G connecté.</div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Application mobile - Contrôle à distance activé.</div>
                                    <div className="rounded-3xl border border-white/10 bg-white/6 p-5">Commandes vocales - Compatible Alexa et Google.</div>
                                </div>
                            </div>
                        );
                    case "parametres":
                        return (
                            <div>
                                <h2 className="text-xl font-semibold text-white">Réglages</h2>
                                <p className="mt-1 text-sm text-white/50">Personnalisez les paramètres de votre lampe.</p>
                                <div className="mt-5 space-y-3 text-white">
                                    <div className="rounded-2xl bg-white/6 border border-white/10 p-4 flex items-center justify-between">
                                        <p>Nom de la lampe</p>
                                        <p className="text-amber-200">CIRCADIA Chambre</p>
                                    </div>
                                    <div className="rounded-2xl bg-white/6 border border-white/10 p-4 flex items-center justify-between">
                                        <p>Garantie</p>
                                        <p className="text-amber-200">2 ans</p>
                                    </div>
                                    <div className="rounded-2xl bg-white/6 border border-white/10 p-4 flex items-center justify-between">
                                        <p>Consommation</p>
                                        <p className="text-amber-200">LED économie</p>
                                    </div>
                                </div>
                            </div>
                        );
                    default:
                        return null;
                }
            };

            return (
                <div className="min-h-screen bg-[#0f0c09] text-white flex items-center justify-center p-4">
                    <div className="w-full max-w-md min-h-[860px] rounded-[2.5rem] border border-white/10 bg-gradient-to-b from-[#1d1712] to-[#070605] shadow-2xl overflow-hidden flex flex-col">
                        <header className="p-6 pb-3">
                            <div className="flex items-center justify-between">
                                <div>
                                    <p className="text-xs tracking-[0.35em] text-amber-300/80">CIRCADIA</p>
                                    <h1 className="mt-2 text-2xl font-semibold">Ma lampe</h1>
                                    <p className="text-sm text-white/50">Chambre principale</p>
                                </div>
                                <button onClick={() => setIsOn(!isOn)} className={`h-12 w-12 rounded-full transition ${isOn ? "bg-amber-400 text-black" : "bg-white/10 text-white"}`}>
                                    {isOn ? "⚡" : "🔌"}
                                </button>
                            </div>

                            <div className="mt-6 border border-white/10 bg-black/30 rounded-3xl overflow-hidden">
                                <div className="p-5">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-sm text-white/50">État actuel</p>
                                            <p className="text-3xl font-semibold mt-1">{intensityText}</p>
                                        </div>
                                        <div className={`h-24 w-24 rounded-full bg-amber-300/30 border border-amber-200/60 shadow-[0_0_60px_rgba(251,191,36,0.55)] flex items-center justify-center ${isOn ? "animate-pulse-custom" : ""}`}>
                                            <span className="text-amber-100 text-4xl">☀️</span>
                                        </div>
                                    </div>
                                    <div className="mt-5 grid grid-cols-3 gap-3 text-center">
                                        <div className="rounded-2xl bg-white/6 border border-white/10 p-3">
                                            <p className="text-[11px] text-white/40">Réveil</p>
                                            <p className="text-xs font-medium mt-1">{wakeTime}</p>
                                        </div>
                                        <div className="rounded-2xl bg-white/6 border border-white/10 p-3">
                                            <p className="text-[11px] text-white/40">Mode</p>
                                            <p className="text-xs font-medium mt-1">{ambientMode}</p>
                                        </div>
                                        <div className="rounded-2xl bg-white/6 border border-white/10 p-3">
                                            <p className="text-[11px] text-white/40">Wi-Fi</p>
                                            <p className="text-xs font-medium mt-1">Connecté</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <nav className="px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`min-w-fit rounded-full px-4 py-3 flex items-center gap-2 text-sm transition ${activeTab === tab.id ? "bg-amber-400 text-black" : "bg-white/8 text-white/70 border border-white/10"}`}>
                                    {tab.label}
                                </button>
                            ))}
                        </nav>

                        <main className="p-5 pt-2 flex-1 overflow-y-auto no-scrollbar">
                            {renderContent()}
                        </main>

                        <footer className="p-5 pt-0">
                            <button className="w-full h-14 rounded-2xl bg-amber-400 hover:bg-amber-300 text-black font-semibold transition">
                                💾 Enregistrer
                            </button>
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CircadiaApp />);
    </script>
</body>
</html>
